name: Build Kernel A146M Hunter

on:
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          dwarves \
          lz4 \
          zstd \
          cpio \
          rsync \
          wget \
          curl \
          git \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          make

    - name: Download Toolchain (Clang 14)
      run: |
        # Baixa Clang 14 compatível com Android R/S
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        tar xf clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        echo "$(pwd)/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04/bin" >> $GITHUB_PATH
        
        # Verifica versões
        clang --version
        ld.lld --version

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Carrega o defconfig hunter
        make hunter_defconfig
        
        # Aplica otimizações via scripts/config (igual ao menuconfig)
        scripts/config --enable CONFIG_CPU_FREQ_GOV_ENERGYAWARE
        scripts/config --enable CONFIG_CPU_FREQ_GOV_USERSPACE
        scripts/config --disable CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE
        scripts/config --enable CONFIG_THERMAL_DEFAULT_GOV_POWER_ALLOCATOR
        scripts/config --enable CONFIG_MALI_EXYNOS_INTERACTIVE_BOOST
        scripts/config --disable CONFIG_ZRAM_DEF_COMP_LZORLE
        scripts/config --enable CONFIG_ZRAM_DEF_COMP_LZ4
        scripts/config --set-str CONFIG_ZRAM_DEF_COMP "lz4"
        scripts/config --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --disable CONFIG_KASAN
        
        # Salva as mudanças
        make olddefconfig

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Compila Image.gz e módulos
        make -j$(nproc --all) Image.gz modules dtbs
        
        echo "Build concluído com sucesso! 🚀"

    - name: Package Artifacts
      if: success()
      run: |
        mkdir -p artifacts
        cp arch/arm64/boot/Image.gz artifacts/
        
        # Copia DTBs do Exynos (ajuste se necessário)
        cp arch/arm64/boot/dts/exynos/*.dtb artifacts/ 2>/dev/null || true
        
        # Empacota módulos
        make INSTALL_MOD_PATH=artifacts/modules modules_install
        
        # Cria zip para download
        cd artifacts
        zip -r ../Hunter-Kernel-A146M-${{ github.sha }}.zip .
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hunter-Kernel-Build
        path: Hunter-Kernel-*.zip
        retention-days: 5
