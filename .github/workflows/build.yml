name: Build Hunter Kernel

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite rodar manualmente 👍

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Adicione outras configs se tiver mais dispositivos
        defconfig: [ hunter_defconfig ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          dwarves \
          lz4 \
          zstd \
          cpio \
          rsync \
          wget \
          curl \
          git

    - name: Download Toolchain (Clang 14 / LLVM)
      run: |
        # Baixa o Clang compatível com o config (r450784d / 14.0.6)
        # Usando uma versão genérica do LLVM 14 para garantir compatibilidade
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        tar xf clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        echo "$(pwd)/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04/bin" >> $GITHUB_PATH
        
        # Verifica versões
        clang --version
        ld.lld --version

    - name: Prepare Kernel Source
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Instala cross-compile básico para headers/libs se necessário
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        
        make O=out ${{ matrix.defconfig }}
        
        # Aplica overrides se necessário (ex: otimizações extras)
        # scripts/config --file out/.config --disable CONFIG_DEBUG_INFO

    - name: Build Kernel & Modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Threads baseadas na máquina da GitHub (geralmente 2-4 vCPUs)
        make O=out -j$(nproc --all) Image.gz modules dtbs
        
        echo "Build concluído com sucesso! 🚀"

    - name: Package Artifacts
      if: success()
      run: |
        mkdir -p artifacts
        cp out/arch/arm64/boot/Image.gz artifacts/
        cp out/arch/arm64/boot/dts/exynos/*.dtb artifacts/ || true # Ajuste conforme a plataforma exata
        
        # Empacota módulos
        make O=out INSTALL_MOD_PATH=artifacts/modules modules_install
        
        # Cria um zip para facilitar o download
        cd artifacts
        zip -r ../Hunter-Kernel-${{ github.sha }}.zip .
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hunter-Kernel-Build
        path: Hunter-Kernel-*.zip
        retention-days: 5
