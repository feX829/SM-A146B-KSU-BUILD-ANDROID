name: Build Kernel A146M Hunter
on:
  workflow_dispatch: 

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y bc bison flex libssl-dev zip git wget make cpio xz-utils

      - name: Clone Kernel Source & Toolchain
        run: |
          git clone https://github.com/devhunter1/android_kernel_samsung_s5e8535 kernel-source
          mkdir toolchain && cd toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar xf clang-r450784d.tar.gz
          
      - name: Apply Performance Patches to Defconfig
        run: |
          cd kernel-source
          # Carrega a config base do Hunter
          make ARCH=arm64 CC=$(pwd)/../toolchain/bin/clang hunter_defconfig
          
          # Aplica as otimizações via scripts/config
          scripts/config --enable CONFIG_CPU_FREQ_GOV_ENERGYAWARE
          scripts/config --enable CONFIG_CPU_FREQ_GOV_USERSPACE
          scripts/config --disable CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE
          scripts/config --enable CONFIG_THERMAL_DEFAULT_GOV_POWER_ALLOCATOR
          scripts/config --enable CONFIG_MALI_EXYNOS_INTERACTIVE_BOOST
          scripts/config --disable CONFIG_ZRAM_DEF_COMP_LZORLE
          scripts/config --enable CONFIG_ZRAM_DEF_COMP_LZ4
          scripts/config --set-str CONFIG_ZRAM_DEF_COMP "lz4"
          scripts/config --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --disable CONFIG_KASAN
          
          # Salva as mudanças
          make ARCH=arm64 CC=$(pwd)/../toolchain/bin/clang olddefconfig

      - name: Compile Kernel
        run: |
          cd kernel-source
          export PATH=$(pwd)/../toolchain/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make ARCH=arm64 CC=clang -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: hunter-kernel-a146m
          path: kernel-source/arch/arm64/boot/Image
